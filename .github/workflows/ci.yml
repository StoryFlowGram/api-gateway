name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  POETRY_VERSION: "2.4.1"

jobs:
  test:
    name: Тести
    runs-on: ubuntu-latest
    steps:
      - name: Завантажуємо код репозиторію
        uses: actions/checkout@v4

      - name: Встановлюємо Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Poetry ${{ env.POETRY_VERSION }}
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Кэш загрузок Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Установка залежностей
        run: poetry install --no-root || poetry install

  build-and-push:
    name: Сборка и публикация образа
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Завантажуємо код репозиторію
        uses: actions/checkout@v4

      - name: Підготовка до збірки Docker-образу
        id: prep
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Авторизуємося в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Збираємо та пушимо Docker-образ до GCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.image_id }}:latest

  deploy:
    name: Деплой (production)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Виконуємо деплой на сервері
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deployer/spaced-repetition-bot/SFG-infra

            # Авторизуємося в GHCR на сервері
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Завантажуємо нові версії образів
            docker compose -f docker-compose-prod.yaml pull

            # Перезапускаємо сервіси
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans
