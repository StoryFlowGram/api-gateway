apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: default
  labels:
    app: api-gateway
    env: production

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway


  minReplicas: 1      
  maxReplicas: 5      

  metrics:
    # Масштабирование по CPU: если средняя загрузка > 70% — добавить под
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Масштабирование по RAM: если средняя загрузка > 80% — добавить под
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    # Быстро скейлим вверх при нагрузке
    scaleUp:
      stabilizationWindowSeconds: 30    
      policies:
        - type: Pods
          value: 2                     
          periodSeconds: 60

    
    scaleDown:
      stabilizationWindowSeconds: 300   
      policies:
        - type: Pods
          value: 1                      
          periodSeconds: 60
